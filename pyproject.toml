[project]
name = "pakketadvies-cli"
version = "0.1.0"
description = "Local CLI that cites which Zorginstituut (ZIN) drug-reimbursement argument to reuse — dossier, date, and source"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
    "rich>=13.8.0",
    "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13.0",
    "openpyxl>=3.1.0",
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[project.scripts]
pakket = "pakketadvies.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pakketadvies"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pakketadvies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
